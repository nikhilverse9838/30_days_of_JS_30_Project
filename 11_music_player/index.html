<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="music-player">
        <nav>
          <div class="circle">
            <i class="fa-solid fa-angle-left"></i>
          </div>
          <div class="circle" onclick="togglePlaylist()">
            <i class="fa-solid fa-bars"></i>
          </div>
        </nav>
        <img src="468-thumbnail.png" class="song-img" id="songImage" />
        <h1 id="songName">Darkhassat</h1>
        <p id="artistName">Arijit singh favourite singer</p>
        <audio id="song"></audio>
        <input type="range" value="0" id="progress" />

        <div class="time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <div class="controls">
          <div onclick="previousSong()">
            <i class="fa-solid fa-backward"></i>
          </div>
          <div onclick="playpause()">
            <i class="fa-solid fa-play" id="ctrlIcon"></i>
          </div>
          <div onclick="nextSong()"><i class="fa-solid fa-forward"></i></div>
        </div>
        <div class="playlist-container" id="playlistContainer">

    <div class="playlist-header">

        <h2>🎵 Playlist</h2>

        <i class="fa-solid fa-xmark" onclick="togglePlaylist()"></i>

    </div>

    <div class="playlist" id="playlist"></div>

</div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
